[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyrox-coach-mcp"
version = "0.2.0"
description = "Local MCP server that turns your Garmin data into hybrid-race (run + stations) coaching"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "garminconnect~=0.3.20",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
hyrox-coach = "hyrox_coach.cli:main"
hyrox-coach-mcp = "hyrox_coach.server:main"
# Deprecated aliases (old names), kept so existing MCP client configs keep working.
hybrid-coach = "hyrox_coach.cli:main"
hybrid-coach-mcp = "hyrox_coach.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hyrox_coach"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
