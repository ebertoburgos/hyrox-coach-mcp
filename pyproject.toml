[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyrox-coach-mcp"
version = "0.1.0"
description = "Local MCP server that turns your Garmin data into hybrid-race (run + stations) coaching"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "garminconnect==0.3.2",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hybrid-coach = "hybrid_coach.cli:main"
hybrid-coach-mcp = "hybrid_coach.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_coach"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
